<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Couverture Codeur : 1600 × 400. Le contenu reste dans la bande centrale (hauteur 260) au cas où Codeur recadre. */
  html, body { margin: 0; width: 1600px; height: 400px; overflow: hidden; }
  body { position: relative; font-family: Roboto, sans-serif; color: #fff;
    background: radial-gradient(circle at 78% 30%, #2aa3c9 0, transparent 45%), linear-gradient(120deg, #0f2a44 0%, #143a5c 55%, #1b6d92 100%); }
  .texte { position: absolute; left: 110px; top: 70px; bottom: 70px; width: 780px; display: flex; flex-direction: column; justify-content: center; }
  .sur { font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; color: #9fdcf0; font-weight: 500; }
  h1 { font-family: Quicksand, sans-serif; font-weight: 700; font-size: 50px; line-height: 1.1; margin: 10px 0 14px; }
  h1 em { font-style: normal; color: #ffb27a; }
  .points { font-size: 18px; white-space: nowrap; color: #d5e6f0; }
  .points b { color: #fff; font-weight: 500; }
  .fenetre { position: absolute; left: 930px; top: 62px; width: 520px; border-radius: 10px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35); }
  .barre { height: 22px; background: #eef1f4; display: flex; align-items: center; gap: 6px; padding-left: 10px; }
  .barre b { width: 9px; height: 9px; border-radius: 50%; background: #e46b5f; }
  .barre b:nth-child(2) { background: #f0bf4c; } .barre b:nth-child(3) { background: #5fc35c; }
  .fenetre img { display: block; width: 100%; height: 250px; object-fit: cover; object-position: top; }
  .tel { position: absolute; left: 1400px; top: 105px; width: 120px; border-radius: 20px; border: 5px solid #0b1f33; overflow: hidden; background: #fff;
    box-shadow: 0 24px 50px rgba(0,0,0,0.4); }
  .tel img { display: block; width: 100%; height: 200px; object-fit: cover; object-position: top; }
</style></head>
<body>
  <div class="texte">
    <div class="sur">Gas'in Sary · studio créatif à distance</div>
    <h1>Logos, identités visuelles et <em>sites web</em></h1>
    <div class="points"><b>Graphiste et développeur web freelance</b> · Entreprises et agences · France et international</div>
  </div>
  <div class="fenetre"><div class="barre"><b></b><b></b><b></b></div><img src="captures/accueil.png" alt=""></div>
  <div class="tel"><img src="captures/mobile.png" alt=""></div>
</body></html>
