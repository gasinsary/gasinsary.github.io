<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Couverture Facebook (1640 × 624) de Voara, marque fictive */
  html, body { margin: 0; }
  body { width: 1640px; height: 624px; overflow: hidden; background: #121712; position: relative; font-family: "Jost", sans-serif; }
  .photo { position: absolute; left: -40px; top: -30px; height: 684px; width: auto;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 34%, transparent 44%); }
  .lueur { position: absolute; right: -200px; top: -200px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(184,149,106,0.12), transparent 65%); }
  .texte { position: absolute; left: 600px; right: 60px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #f4efe7; }
  .sur { font-size: 21px; letter-spacing: 0.42em; color: #c9a26b; font-weight: 400; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 104px; line-height: 1.02; margin: 26px 0 30px; }
  h1 em { font-style: italic; }
  .filet { width: 110px; height: 2px; background: #c9a26b; }
  .produit { font-size: 27px; font-weight: 300; letter-spacing: 0.04em; margin-top: 26px; }
  .marque { font-size: 30px; letter-spacing: 0.5em; margin-top: 34px; font-weight: 300; }
</style></head>
<body>
  <div class="lueur"></div>
  <img class="photo" src="../../portfolio/campagne-reseaux-sociaux-voara/img/couverture.jpg" alt="">
  <div class="texte">
    <div class="sur">NOUVEAU</div>
    <h1>L'éclat vient<br><em>de loin.</em></h1>
    <div class="filet"></div>
    <div class="produit">Sérum Éclat Baobab · 30 ml</div>
    <div class="marque">VOARA</div>
  </div>
</body></html>
