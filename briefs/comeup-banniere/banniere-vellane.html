<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">
<style>
  /* Bannière LinkedIn (1584 × 396) de Maison Vellane, marque fictive.
     La photo de profil recouvre le coin inférieur gauche : le texte commence à droite de cette zone. */
  html, body { margin: 0; }
  body { width: 1584px; height: 396px; overflow: hidden; position: relative; background: #f6efe3; font-family: "DM Sans", sans-serif; color: #3a2a1f; }
  .rond { position: absolute; right: -40px; top: -150px; width: 560px; height: 560px; border-radius: 50%; background: #ecdfc9; }
  .assiette { position: absolute; right: -150px; top: -120px; width: 640px; }
  .bande { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #5f6e52; }
  .texte { position: absolute; left: 420px; top: 66px; width: 660px; }
  .marque { display: flex; align-items: center; gap: 12px; font-family: "Fraunces", serif; font-size: 26px; }
  .marque img { width: 40px; }
  h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: 46px; line-height: 1.1; margin: 18px 0 18px; letter-spacing: -0.01em; }
  h1 em { color: #b5562f; font-style: italic; }
  .pros { font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b5646; font-weight: 600; }
</style></head>
<body>
  <div class="rond"></div>
  <img class="assiette" src="../maison-vellane/illus/hero.svg" alt="">
  <div class="texte">
    <div class="marque"><img src="../maison-vellane/illus/embleme.svg" alt="">Maison Vellane</div>
    <h1>Le sablé pur beurre,<br><em>façonné à la main</em> depuis 1962</h1>
    <div class="pros">Revendeurs · Hôtellerie · Cadeaux d'entreprise</div>
  </div>
  <div class="bande"></div>
</body></html>
