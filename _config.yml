# Configuration Jekyll du site Gas'in Sary
# GitHub Pages reconstruit le site à chaque "git push".

title: "Gas'in Sary"
description: "Studio créatif francophone basé à Madagascar : logos, identités visuelles et sites web pour les entreprises et les agences, en France et à l'international."
url: "https://gasinsary.github.io"
# "baseurl" n'est volontairement PAS défini : GitHub Pages le règle tout seul.
#   - dépôt de production (gasinsary.github.io) : baseurl vide
#   - dépôt de test (ex. "test")               : baseurl = /test
# Tous les liens internes doivent donc passer par le filtre "relative_url".
lang: fr
author: "Gas'in Sary"

# Coordonnées affichées sur le site (liens téléphone, e-mail, WhatsApp, formulaire)
email: direction.gasinsary@gmail.com
telephone: "+261 32 84 718 67"

# Sert à calculer l'âge affiché dans « À propos » (format année-mois-jour)
date_naissance: "1992-02-21"

# Image utilisée pour les partages (Facebook, LinkedIn...) quand la page n'en définit pas
image_partage: /images/preview.jpg

plugins:
  - jekyll-sitemap

# Un fichier dans _projets/ = une page /portfolio/<nom-du-fichier>/
collections:
  projets:
    output: true
    permalink: /portfolio/:name/

defaults:
  - scope:
      path: ""
      type: projets
    values:
      layout: projet
      body_class: portfolio-details-page
      swiper: true
  # Blog : un fichier _posts/AAAA-MM-JJ-nom.md = un article à l'adresse /blog/nom/
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      permalink: /blog/:title/
  - scope:
      path: "googleaa7d45fdd426d7f9.html"
    values:
      sitemap: false
  - scope:
      path: "google17eaf983518ef390.html"
    values:
      sitemap: false

exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - HISTORIQUE.md
  - AUDIT.md
  - briefs/
  - forms/
  - assets/scss/
  - Gemfile
  - Gemfile.lock
